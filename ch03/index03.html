<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>ch03 index03</h1>

    <button onclick="sayHello()">클릭!</button>

    <script>
        console.log("-------------- 1. var의 호이스팅 ---------------");

        // console.log(abc);   // 선언하지 않아 오류
        console.log(greeting);  // undefined 출력
        var greeting = "안녕";


        console.log("-------------- 2. let, const의 호이스팅 TDZ ---------------");
        // let과 const도 선언이 끌어올려지나, 선언줄까지 사용할 수 없으며 그 구간을 TDZ라고 부른다.

        // console.log(wellcome); 오류발생
        const wellcome = "반가와!";

        console.log("-------------- 3. 함수 선언문의 호이스팅 ---------------");
        console.log(sayHello());
        function sayHello() {
            console.log("안녕하세요?");
        }


        console.log("-------------- 4. 함수 표현식은 호이스팅 되지 않는다. ---------------");
        // 함수 표현식 : 값이 오는 자리에 놓인 function

        sayBye();
        const sayBye = function() {
            console.log("안녕히가세요");
        }

        sayBye();

    </script>
    
</body>
</html>
