<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>ch07 index05.html</h1>

    <script>
        
        // 1. 중간이 비어 있는 데이터
        const post = {
            title : "첫 번째 글",
            writer: null            // 탈퇴한 회원이라 작성자 정보가 없음
        };

        // 일반적 접근
        // console.log(post.writer.name);   // > 오류 발생

        // 옵셔널 체이닝
        console.log(post.writer ?. name);
        post.age;

        console.log("여러 단게 처리. 배열, 함수에도 처리 가능");
        const order = {
            id: 1001,
            customer: {
                name: "이하늘",
                address: null
            },
            items: null
        };

        console.log(order.customer?.name);
        console.log(order.customer?.address?.city);

        // 배열에서 쓸 때는 ?.[]형태
        console.log(order.items?.[0]);

        // 함수에서는 ?.()
        console.log(order.customer?.phone?.trim());

        console.log("실무에서는 「?.」, 「??」를 함께 많이 사용한다.");

        const writerName = post.writer?.name ?? "탈퇴한 회원";
        console.log(writerName);


        const cityName = order.customer?.address?.city ?? "주소 미입력";
        console.log(cityName);

    </script>
    
</body>
</html>
