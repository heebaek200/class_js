<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>ch07 closure_example.html</h1>

    <script>
        
        function createCounter(start) {
            let count = start;

            return function () {
                count += 2;
                return count;
            };
        }

        const a = createCounter(0);
        const b = createCounter(10);

        console.log(a());
        console.log(a());
        console.log(b());
        console.log(a());
        console.log(b());

    </script>
    
</body>
</html>
