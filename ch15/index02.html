<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            padding: 20px;
            background-color: white;
            transition: background-color .5s cubic-bezier(.34, 1.8, .64, 1),
                color .5s cubic-bezier(.34, 1.8, .64, 1);
        }
        body.dark {
            background-color: #222;
            color: #eee;
        }
    </style>
</head>
<body>
    <h1>ch15 index02.html</h1>

    <button id="themeBtn">다크 모드</button>
    <p>본문 내용입니다. 버튼을 누르면 배경과 글자색이 바뀝니다.</p>

    <script>

        const themeBtnEl = document.getElementById("themeBtn");

        // 1. 페이지를 열 때 저장된 설정을 읽어 적용
        if (window.localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark");
            themeBtnEl.textContent = "라이트 모드";
        }


        // 2. 이벤트 리스너 등록 및 핸들러 처리
        themeBtnEl.addEventListener("click", () => {
            const isDark = document.body.classList.toggle("dark");

            window.localStorage.setItem("theme", isDark ? "dark" : "light");
            themeBtnEl.textContent = isDark ? "라이트 모드" : "다크 모드";
        });

    </script>
</body>
</html>
