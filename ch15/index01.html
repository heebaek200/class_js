<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            flex-direction: column;
            padding: 50px;
        }
        .heart-container {
            display: flex;
            gap: 30px;
        }
        .like-heart {
            font-size: 40px;
            cursor: pointer;

            /* 애니메이션 설정 : 속성명 지속시간 속도곡선 */
            transition:
                color .5s ease,
                transform .5s cubic-bezier(.34, 1.8, .64, 1);
        }
        .liked {
            color: red;
            transform: scale(1.5);
        }
    </style>
</head>
<body>
    <h1>ch15 index01.html</h1>

    <div class="heart-container">
        <div class="like-heart">&#9825;</div>
        <div class="like-heart">&#9825;</div>
        <div class="like-heart">&#9825;</div>
    </div>

    <script>
        const container = document.querySelector(".heart-container");

        // 이벤트 위임: 하트 세 개에 각각 이벤트 리스너를 달지 않고, 부모에 하나만 단다.
        container.addEventListener("click", event => {
            // 컨테이너 영역 중 하트가 아닌 빈 공간을 클릭하면 거르기 (early-return pattern)
            if (! event.target.classList.contains("like-heart")) {
                return;
            }

            // liked가 있으면 제거, 없으면 추가. 반환 값은  T/F
            const isLiked = event.target.classList.toggle("liked");
            console.log(isLiked ? "좋아요" : "좋아요 취소");
            
        });
    </script>
</body>
</html>
