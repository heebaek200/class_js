<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>ch10 index02.html</h1>
    
    <button id="alert-btn">alert : 알리기만</button>
    <button id="confirm-btn">confirm : 확인/취소 묻기</button>
    <button id="prompt-btn">prompt : 글자를 입력 받기</button>
    <button id="open-btn">open : 새창열기</button>
    <button id="prompt2-btn">prompt : 글자를 입력 받기 × 2</button>

    <p id="info">결과 표시 영역</p>

    <script>
        const infoEl = document.querySelector("#info");

        // 1.
        document.getElementById("alert-btn").addEventListener("click", function() {
            alert("저장");
        });

        // 2.
        document.getElementById("confirm-btn").addEventListener("click", function() {
            const isOk = confirm("정말 삭제하시겠습니까?");
            if (isOk) {
                infoEl.textContent = "삭제 완료";
                iinfoEl.style.color = "red";
            } else {
                infoEl.textContent = "삭제 취소";
                infoEl.style.color = "green";
            }
        });

        // 3.
        document.getElementById("prompt-btn").addEventListener("click", function() {
            const userName = prompt("이름을 입력하세요", "홍길동");

            if (userName === null) {
                infoEl.textContent = "입력을 취소했습니다.";
            } else {
                infoEl.textContent = `${userName}님 환영합니다.`;
            }
        });

        // 4. open: 새 창(또는 새 탭)을 연다. 세 번째 인수로 크기를 지정하면 팝업 창이 된다.
        document.getElementById("open-btn").addEventListener("click", function() {
            window.open("https://www.google.com", "_blank", "width=400, hight=400");
        });

        // 5. 실험: 프롬프트에서 숫자를 입력 받아서 2를 곱하기 해보자.
        document.getElementById("prompt2-btn").addEventListener("click", function() {
            // const userName = prompt("이름을 입력하세요", "홍길동");
            const userName = prompt("이름을 입력하세요", "2");

            if (userName === null) {
                infoEl.textContent = "입력을 취소했습니다.";
            } else {
                infoEl.textContent = `${userName * 2}님 환영합니다.`;
            }
        });

    </script>
    
</body>
</html>
