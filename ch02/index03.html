<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <h1>ch02 index03.html 파일</h1>

    <script>

        console.log("1. ---------------- 산술 연산자 -------------------");
        let a = 10;
        let b = 3;

        console.log(a + b);
        console.log(a - b);
        console.log(a * b);
        console.log(a / b);
        console.log(a % b);

        console.log("2. ---------------- 할당 연산자 -------------------");
        let point = 100;

        point += 50;
        console.log(point);

        point -= 30.1;
        console.log(point);

        point++;
        console.log(point);

        point--;
        console.log(point);
        
        console.log("3. ---------------- 비교 연산자 -------------------");
        console.log(10 > 5);
        console.log(10 <= 5);
        console.log(10 == "10");
        console.log(10 === "10");
        console.log(10 != "10");
        console.log(10 !== "10");

        console.log("4. ---------------- 논리 연산자 -------------------");
        console.log(true && false);
        console.log(true || false);
        console.log(!false);
        
        console.log("5. ---------------- 연산자 우선순위 -------------------");
        console.log(2 + 3 * 4);
        console.log((2 + 3) * 4);



    </script>
</body>
</html>
