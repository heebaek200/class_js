<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #noticeBoard {
            padding: 50px;
            border: 1px solid #ccc;
            text-align: center;

            background-color: white;
            color: #333;

            transition:
                background-color 0.5s ease,
                color 0.5s ease,
                border-color 0.5s ease;
        }

        #noticeBoard.success {
            background-color: #dff5e1;
            border-color: #79c985;
            color: #176b2c;
        }

        #noticeBoard.fail {
            background-color: #fde2e2;
            border-color: #e48181;
            color: #9d2222;
        }
    </style>
</head>

<body>
    <h1>ch17 index04.html</h1>

    <input
        type="text"
        value="소주"
        style="padding: 4px;"
        id="orderInput"
    >

    <button id="orderButton">주문 시작</button>

    <p id="noticeBoard">
        주문을 기다리고 있습니다.
    </p>

    <script>
        const orderButton = document.getElementById("orderButton");
        const orderInput = document.getElementById("orderInput");
        const noticeBoard = document.getElementById("noticeBoard");

        /**
         * 주문받은 음료를 3초 뒤에 처리한다.
         * 아메리카노와 라떼는 주문 성공으로 처리한다.
         * 그 외의 메뉴는 Promise를 reject하여 주문 실패로 처리한다.
         */
        function orderCoffee(order) {
            return new Promise(function(resolve, reject) {

                // 시간이 걸리는 작업을 3초 타이머로 흉내낸다.
                setTimeout(function() {

                    if (order === "아메리카노" || order === "라떼") {
                        resolve(order + "이(가) 나왔습니다.");
                    } else {
                        reject("죄송합니다. " + order + "은(는) 판매하지 않습니다.");
                    }

                }, 3000);
            });
        }

        /**
         * 주문 처리 중 안내 문구의 점 개수를 반복해서 변경한다.
         * '.', '..', '...' 순서로 표시하여 비동기 작업이 진행 중임을 보여준다.
         * 반환된 intervalId를 이용하면 나중에 clearInterval로 애니메이션을 중지할 수 있다.
         */
        function startWaitingAnimation() {
            let dotCount = 1;

            noticeBoard.textContent = "주문을 진행하고 있습니다.";

            return setInterval(function() {

                // 점의 개수를 1개 → 2개 → 3개로 반복한다.
                noticeBoard.textContent =
                    "주문을 진행하고 있습니다" + ".".repeat(dotCount);

                dotCount++;

                if (dotCount > 3) {
                    dotCount = 1;
                }

            }, 500);
        }

        /**
         * 주문 버튼을 클릭하면 주문 처리를 시작한다.
         * Promise가 성공하면 성공 메시지와 초록색 스타일을 표시한다.
         * Promise가 실패하면 실패 메시지와 붉은색 스타일을 표시한다.
         */
        orderButton.addEventListener("click", async () => {

            // 이전 주문 결과 스타일을 제거하고 초기 상태로 되돌린다.
            noticeBoard.classList.remove("success", "fail");

            const waitingInterval = startWaitingAnimation();

            try {
                const message = await orderCoffee(orderInput.value);

                // 비동기 작업이 끝났으므로 대기 애니메이션을 종료한다.
                clearInterval(waitingInterval);

                noticeBoard.textContent = message;
                noticeBoard.classList.add("success");

            } catch (error) {

                // 실패한 경우에도 대기 애니메이션을 종료해야 한다.
                clearInterval(waitingInterval);

                noticeBoard.textContent = error;
                noticeBoard.classList.add("fail");
            }
        });
    </script>
</body>
</html>
