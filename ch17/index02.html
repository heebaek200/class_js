<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>ch17 index02.html</h1>
    
    <p>Promise 객체 생성 즉시 대기 상태가 됨. 작업이 끝나면 이행 또는 거부 상태가 됨.</p>

    <button id="startBtn">주문</button>
    
    <script>
        
        function orderCoffee(order) {
            return new Promise(function(resolve, reject) {
                // 이 안에는 시간이 걸리는 작업을 적는다. 3초 타이머로 흉내만 냄.

                setTimeout(function() {
                    // 3초 뒤 응답이 오면 해야할 일을 설계한다.
                    if (order === "아메리카노" || order === "라떼") {
                        resolve(order + "가 나왔습니다.");  // 성공: 이행 상태로 바꾸고 값 전달
                    } else {
                        reject("죄송합니다. " + order + "은 판매하지 않습니다.");
                                                            // 실패: 거부 상태로 만들고 이유 전달
                    }
                }, 3000);
            });
        }

        document.getElementById("startBtn").addEventListener("click", function() {
            const orderPromise = orderCoffee("라떼");
            // const orderPromise = orderCoffee("소주");

            console.log("콘솔에서 상태 확인 : ",  orderPromise);

            // 클릭 직후: pending 상태가 되고, 3초 뒤 rejected로 응답을 받는다.
        });

    </script>
</body>
</html>
