<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>ch17 index03.html</h1>
    
    <input type="text" value="소주" style="padding: 4px;" id="orderInput">
    <button id="orderButton">주문 시작</button>
    <p id="noticeBoard" style="padding: 50px; border: 1px solid #ccc; text-align: center;">주문을 기다리고 있습니다.</p>
    
    <script>
        const orderButton = document.getElementById("orderButton");
        const orderInput  = document.getElementById("orderInput");
        const noticeBoard = document.getElementById("noticeBoard");
        
        function orderCoffee(order) {
            return new Promise(function(resolve, reject) {
                // 이 안에는 시간이 걸리는 작업을 적는다. 3초 타이머로 흉내만 냄.

                setTimeout(function() {
                    // 3초 뒤 응답이 오면 해야할 일을 설계한다.
                    if (order === "아메리카노" || order === "라떼") {
                        resolve(order + "이(가) 나왔습니다.");  // 성공: 이행 상태로 바꾸고 값 전달
                    } else {
                        reject("죄송합니다. " + order + "은(는) 판매하지 않습니다.");
                                                            // 실패: 거부 상태로 만들고 이유 전달
                    }
                }, 3000);
            });
        }

        orderButton.addEventListener("click", function() {
            // console.log(orderInput);
            // console.log(orderInput.value);
            orderCoffee(orderInput.value)
                .then((message) => {
                    console.log("결과 확인: ", message);
                    noticeBoard.textContent = message;
                })
                .catch((message) => {
                    console.error("결과 확인: ", message);
                    noticeBoard.textContent = message;
                });

            console.log("즉시 진동벨을 받았습니다.");

        });

    </script>
</body>
</html>
