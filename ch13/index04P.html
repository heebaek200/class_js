<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            padding: 20px;
        }
        ul {
            list-style: none;
            margin-top: 20px;
            width: 300px;
        }
        li {
            background-color: lightcyan;
            border: 1px solid lightblue;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        li.done {
            text-decoration: line-through;
        }
        button {
            padding: 5px 10px;
        }
    </style>
</head>
<body>
    <h1>ch13 index04P.html 파일</h1>

    <button id="btnAdd">새 아이템 추가</button>

    <ul id="itemList">
    </ul>

    <script>
        // 페이지가 로드된 시점의 삭제 버튼 3개 (NodeList 타입)
        const deleteBtnList = document.querySelectorAll(".delete-btn");
        const btnAddEl = document.querySelector("#btnAdd");
        const itemListEl = document.querySelector("#itemList");
        
        // 중요
        // 1. 이벤트 위임: 부모 요소 하나에만 리스너를 한 번 등록한다. (ul 태그)
        itemListEl.addEventListener("click", e => {
            // 클릭된 요소가 삭제 버튼일 때만 동작.
            if (e.target.classList.contains("delete-btn")) {
                // e.target.parentElement
                // 문제 2. 4절 예제에서 삭제 버튼을 눌렀을 때 confirm으로 "정말 삭제하시겠습니까?"를 묻고, 확인을 눌렀을 때만 삭제되게 합니다.
                if (window.confirm("정말로 삭제하시겠습니까?")) {
                    e.target.closest("li").remove();
                }
            }

            // 문제 1. 4절 예제의 각 li 안에 "완료" 버튼(class="done-btn")을 하나 더 넣습니다.
            // 완료 버튼을 누르면 그 li에 done 클래스가 토글되어 글자에 취소선이 그어지게 합니다. 리스너는 ul에 있는 하나로 처리합니다.
            else if (e.target.classList.contains("done-btn")) {
                e.target.closest("li").classList.add("done");
            }
        });

        btnAddEl.addEventListener("click", () => {
            const currentCount = itemListEl.children.length;

            const newItem = document.createElement("li");
            newItem.innerHTML = `기존 아이템 ${currentCount+1} <button class="delete-btn">삭제</button><button class="done-btn">완료</button>`;

            itemListEl.append(newItem);
        });

    </script>
</body>
</html>
