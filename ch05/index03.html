<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>ch05 index03.html</h1>

    <script>
        console.log("1. 함수 표현식을 화살표 함수로...");

        const addOld = function(x, y) {
            return x + y;
        }

        const addNew = (x, y) => x + y;

        console.log("2. 축약 규칙");

        // 2.1 몸체 전체가 return 한 줄이면 중괄호와 return 키워드를 생략할 수 있다.
        const subtract = (n1, n2) => n1 - n2;
        console.log(subtract(100, 10));

        // 2.2 매개 변수가  하나면 괄호도 생략 가능하다.
        const resultDouble = n => n * 2;

        // 2.3 매개 변수가 없으면 빈 괄호만 사용하면 된다.
        const getRandom = () => Math.random();

        console.log(getRandom);
        console.log(getRandom());

        // 2.4 여러 줄이라면 중괄호와 return 키워드를 그대로 사용한다.
        const calculateTotal = (price, count) => {
            const subtotal = price * count;
            const tax = subtotal * .1;
            return subtotal + tax;
        };

        console.log(calculateTotal(1000, 3));

        // 3. 주의. 객체를 한 줄 return할 때는 소괄호로 감싸는 테크닉을 쓴다.
        const makeUser = name => ({name: name, active: true});
        console.log(makeUser("홍길동"));

    </script>
    
</body>
</html>
