<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>ch05 index02.html</h1>

    <script>
        // 1. 함수 표현식 : 익명함수를 만들어 변수에 담기
        const getCurrentTime = function() {
            const now = new Date();
            return now.toLocaleString();
        }

        // 2. 함수 자체 vs 함수 호출
        console.log(getCurrentTime);
        console.log(getCurrentTime());
        console.log(typeof getCurrentTime); // function

        // 3. 함수를 다른 변수에 복사할 수 있다.
        const otherName = getCurrentTime;
        console.log(otherName());

        // 4. 함수 선언문 vs 함수 표현식
        function multiply(x, y) {
            return x * y;
        }

        const multiply2 = function(x, y) {
            return x * y;
        }

        console.log(multiply(2, 5));
        console.log(multiply2(2, 5));

    </script>
    
</body>
</html>
