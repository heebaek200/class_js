<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>ch04 - index02.html</h1>

    <script>
        
        const member = {
            firstName: "길동",
            lastName : "홍",
            age      : 30,

            // 1. 중첩 객체
            // 값 자리에 객체를 넣을 수 있다.
            address: {
                street: "부산시 진구 50번길",
                city  : "부산",
                zip   : "456789"
            },

            // 2. 배열도 넣을 수 있음
            hobbies: ["독서", "등산", "요라", "코딩"],

            // 3. 값 자리에 함수를 넣을 수 있다.
            introduce: function() {
                console.log("제 이름은 " + this.lastName + this.firstName + "입니다");
            }
        };

        console.log("중첩된 값 꺼내기");
        console.log(member.address.city);
        console.log(member.hobbies[1]);

        console.log("메서드 호출");
        member.introduce();

        console.log(member.introduce);

        console.log("속성 추가하기");
        // 없는 키에 값을 넣으면 그게 새로운 속성이 된다.
        member.email = "a@naver.com";
        console.log(member.email);

        console.log("값 수정");
        member.age = 31; // 수정 가능
        console.log(member.age);

        console.log("속성 삭제");
        delete member.email;
        console.log(member.email);

        console.log("const 변수의 내부 수정이 가능한 이유");
        // 변수 자체가 불변이지, 참조 내부는 가변이기 때문

    </script>
    
</body>
</html>
