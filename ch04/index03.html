<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>ch04 - index03.html</h1>

    <script>
        
        console.log("1. 배열 만들기와 인덱스");
        const fruits = ["사과", "바나나", "포도"];

        console.log(fruits);
        console.log(fruits[0]);
        console.log(fruits[1]);
        console.log(fruits[2]);
        console.log(fruits[3]);
        console.log(fruits.length);

        // 마지막 인덱스 값을 출력할 때
        console.log(fruits[fruits.length - 1]);

        // JS에서 값 추가와 제거
        fruits.push("딸기");
        console.log(fruits);

        fruits.pop();
        console.log(fruits);

        fruits[1] = "블루베리";

        // 반복만 활용
        for (let i = 0 ; i < fruits.length ; i++) {
            console.log(i + "번째 과일 " + fruits[i]);
        }

        for (const f of fruits) {
            console.log(f);
        }

        // 객체와 배열: 서버 데이터의 기본형태가 됨
        const studentList = [
            {name: "홍길동", age: 20, major: "컴퓨터공학"}, 
            {name: "이순신", age: 21, major: "경영학"},
        ];
        console.log(studentList);

        // 반복문 돌면서 해당 객체의 이름과 나이를 출력하시오 (전체)
        studentList.forEach(function(ele) {
            console.log("이름 : " + ele.name + " , 나이 : " + ele.age);
        });


    </script>
    
</body>
</html>
