<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .card {
            border: 1px solid #ffcdcd;
            padding: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>ch08 index02.html</h1>
    <div id="product-list">     </div>

    <script>
        
        console.log("----------- 1. 숫자 배열 변환 -----------");
        const numbers = [1, 2, 3, 4, 5];

        const doubled = numbers.map((n) => n * 2);

        console.log(numbers);
        console.log(doubled);

        // 도전 과제: map을 쓰지 않고 같은 효과 내보기.
        const doubled2 = [];
        numbers.forEach(v => {doubled2.push(v * 2)});
        console.log(doubled2);

        
        const doubled3 = [];
        numbers.some(v => {doubled3.push(v * 2)});
        console.log(doubled3);


        console.log("----------- 2. 객체 배열에서 이름만 뽑기 -----------");
        const products = [
            {id: 1, name: "무선마우스"   , price: 25_000, stock: 3 },
            {id: 2, name: "기계식 키보드", price: 89_000, stock: 0 },
            {id: 3, name: "모니터 받침대", price: 15_000, stock: 12},
        ];
        
        const names = products.map(p => p.name);
        console.log(names);


        console.log("----------- 3. 객체 배열을 HTML 문자열 배열로 -----------");

        const cardList = products.map((p) => {

            return `
                <div class="card">
                    <h3>${p.name}</h3>
                    <p>가격 : ${p.price.toLocaleString()} 원</p>
                    <p>재고 : ${p.stock.toLocaleString()} 개</p>
                </div>
            `;
        });

        console.log(cardList);
        document.getElementById("product-list").innerHTML = cardList.join("");


    </script>
    
</body>
</html>
