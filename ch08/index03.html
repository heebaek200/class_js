<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .card {
            border: 1px solid #ffcdcd;
            padding: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>ch08 index03.html</h1>
    <div id="product-list">     </div>

    <script>
        
        console.log("----------- 1. 숫자 배열에서 짝수만 -----------");
        const numbers = [1, 2, 3, 4, 5];

        const evens = numbers.filter((n) => n % 2 === 0);

        console.log(evens);


        console.log("----------- 2. 객체 배열에서 재고 있는 상품만 뽑기 -----------");
        const products = [
            {id: 1, name: "무선마우스"   , price: 25_000, stock: 3 },
            {id: 2, name: "기계식 키보드", price: 89_000, stock: 0 },
            {id: 3, name: "모니터 받침대", price: 15_000, stock: 12},
        ];
        
        const isStock = products.filter(p => p.stock > 0);
        console.log(isStock);


        console.log("----------- 3. 조건을 여러개 걸기 -----------");

        const cheap = products.filter(p => p.stock > 0 && p.price > 30000);
        console.log(cheap);


        console.log("----------- 4. filter와 map 이어쓰기 -----------");
        const cardList = products
            .filter((p) => p.stock > 0)
            .map((p) => {

            return `
                <div class="card">
                    <h3>${p.name}</h3>
                    <p>가격 : ${p.price.toLocaleString()} 원</p>
                    <p>재고 : ${p.stock.toLocaleString()} 개</p>
                </div>
            `;
        });

        console.log(cardList);
        document.getElementById("product-list").innerHTML = cardList.join("");


    </script>
    
</body>
</html>
