<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>ch18 index01.html</h1>
    

    <script>
        // 샘플 데이터
        const todo = {userId: 1, id: 100, title: "오늘 복습", completed: false};

        // 객체 --> JSON 문자열 (서버로 보낼 때)
        const jsonText = JSON.stringify(todo);
        console.log(jsonText);
        console.log(typeof jsonText);

        // JSON 무나열 --> 객체 (서버에서 받았을 때)
        const parsedTodo = JSON.parse(jsonText);
        console.log(parsedTodo);
        console.log(typeof parsedTodo);

        // 오류 확인
        try {
            const badTodo = JSON.parse("JSON이 아닌 형태, 제가 한 번 입력해보겠습니다.");
        } catch (error) {
            console.error("잘못된 JSON 형식입니다.", error);
        }
    </script>
</body>
</html>
