<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="../reset.css">

    <style>
        /* 1단계: 리셋 + 전역 스타일 */
        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #333;
            padding: 20px;
        }

        /* 2단계: 레이아웃 */
        .banner-container {
            display: flex;
            align-items: center;
            width: 80%;
            max-width: 600px;
            margin: 50px auto;
        }
        .image-wrapper {
            flex: 1;
            height: 200px;
            position: relative; /* 자식 position: absolute의 기준점 */
            overflow: hidden;
        }

        /* 3단게: 컴포넌트 스타일 */
        .banner-container {
            border: 2px solid #333;
        }
        .control-btn {
            padding: 20px;
            background: none;
            border: none;
            font-size: 20px;;
        }

        /* 4단계: 세부 조정 */
        .image-track {
            display: flex;
            width: 100%;
            height: 100%;

            transform: translateX(-200%);
            transition: transform .5s ease;
        }

        .image-wrapper img {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .control-btn {
            cursor: pointer;

            transition: transform .2s ease;
        }

        .control-btn:hover {
            transform: scale(1.3);
        }

    </style>
</head>
<body>
    <h1>ch16 index04.html - 배너 변경</h1>

    <div class="banner-container">
        <button class="control-btn prev-btn">&lt;</button>

        <div class="image-wrapper">

            
            <div class="image-track">
                <img src="https://picsum.photos/id/20/400/300" alt="">
                <img src="https://picsum.photos/id/30/400/300" alt="">
                <img src="https://picsum.photos/id/40/400/300" alt="">
            </div>
        </div>


        <button class="control-btn next-btn">&gt;</button>

        <script>
            const prevButtton = document.querySelector(".prev-btn");
            const nextButtton = document.querySelector(".next-btn");
            const imageList = document.querySelectorAll(".image-wrapper img");
            const imageTrack = document.querySelector(".image-track");
            const railParticles = document.querySelector(".rail-particles");

            // 상태 변수 관리법: 현재 보이는 이미지의 인덱스, 화면은 항상 이 값을 따라간다.
            let currentIndex = 2;
            const imageCount = imageList.length;    // 3

            const bannerContainer = document.querySelector(".banner-container");
            let timerId = null;

            function startAutoSlide() {
                // 이미 돌고 있으면 또 만들지 않는다. 타이머가 두개면 속도가 두배가 됨.
                if (timerId !== null) {
                    return;
                }
                timerId = setInterval(() => {
                    updateBanner((currentIndex + 1) % imageCount);
                }, 2 * 1000);
            }

            function stopAutoSlide() {
                clearInterval(timerId);
                timerId = null;
            }

            bannerContainer.addEventListener("mouseenter", stopAutoSlide);
            bannerContainer.addEventListener("mouseleave", startAutoSlide);

            // 1. 이전 버튼 리스너 등록
            prevButtton.addEventListener("click", () => {
                let newIndex = (currentIndex - 1 + imageCount) % imageCount;
                
                // 화면 갱신
                updateBanner(newIndex);
            });

            // 2. 다음 버튼 리스너 등록
            nextButtton.addEventListener("click", () => {
                let newIndex = (currentIndex + 1) % imageCount;

                // 화면 갱신
                updateBanner(newIndex);
            });

            /**
             * 전달받은 이미지 인덱스를 현재 상태로 저장한다.
             * 이미지 트랙을 이동시켜 해당 이미지를 화면에 표시하고,
             * 이동 순간 레일 주변에 쇠가루 효과를 재생한다.
             */
            function updateBanner(newIndex) {
                // 현재 이미지 인덱스 변경
                currentIndex = newIndex;

                // 이미지 트랙 이동
                imageTrack.style.transform = `translateX(-${currentIndex * 100}%)`;

                // 쇠가루 애니메이션을 다시 실행하기 위해 클래스를 재부착한다.
                railParticles.classList.remove("active");

                // 브라우저가 이전 상태를 한 번 렌더링하게 만들어 애니메이션 재시작
                void railParticles.offsetWidth;

                railParticles.classList.add("active");
            }
            startAutoSlide();
        </script>
    </div>
</body>
</html>
