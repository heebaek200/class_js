<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>ch09 index01.html</h1>
    <p>첫번째 문단</p>
    <p>두번째 문단</p>

    <script>
        // 1. document는 DOM 트리의 루트
        console.log(document);
        console.log(document.body);

        // 2. 트리는 부모와 자식 관계
        console.log(document.body.children);
        console.log(document.body.children[0]);

        // 3. 자바스크립트로 DOM을 바꾸면 화면이 바뀐다
        document.body.children[1].textContent = "자바스크립트가 바꾼 문단";
    </script>
</body>
</html>
